name: Build APK

on:
  push:
    branches: [ "claude/prompt-in-file-j1dh9v", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK as a downloadable release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-debug-latest
          name: App-Limit – Finale Version (neuester Build)
          body: |
            Automatisch gebaute, installierbare Debug-APK vom jeweils letzten Commit.

            Installation: APK auf ein Android-Gerät (Android 10+) laden und
            "Installation aus unbekannten Quellen" für den Browser/Dateimanager
            erlauben. Anschließend im Onboarding die Sonderzugriffe erteilen.
          files: app/build/outputs/apk/debug/app-debug.apk
